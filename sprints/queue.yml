    evidence: '12,394 PDP sessions → 1,222 ATC = 9.9% (benchmark 14%) | downstream
      ATC→purchase 27.5% | AOV=$102.07 | bot-filtered: excluded 3,601 sessions from
      2 source(s)'
    risk_note: Re-measure before/after; roll back if the metric regresses beyond the
      neutral threshold.
