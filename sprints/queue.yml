    level: MEDIUM
    description: Copy + internal links
    estimated_minutes: 45
  recommendation_level: detailed
  recommendation:
    objective: Lift TBD from baseline pending to improvement on /
    steps:
    - Pull the last 28 days of funnel data for / (sessions → PDP → ATC → checkout
      → purchase) and screenshot the exact drop-off step.
    - Reproduce the worst drop-off on a real phone at 4G speed; log layout shift,
      tap-target size, and any pop-up/modal interference.
    - Ship the 2-3 highest-friction fixes first (sticky add-to-cart, above-the-fold
      price/CTA, tap targets ≥ 44px).
    - Instrument an event on the changed step so the next scan can attribute movement.
    - Re-measure after 28 days against the pre-change 28-day baseline; roll back any
      step that regresses.
    expected_impact_usd_month: 5040.66
    effort: MEDIUM · ~45 min
