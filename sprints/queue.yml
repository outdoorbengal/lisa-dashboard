    evidence: '12,206 PDP sessions → 1,230 ATC = 10.1% (benchmark 14%) | downstream
      ATC→purchase 27.5% | AOV=$97.45 | bot-filtered: excluded 3,555 sessions from
      2 source(s)'
    risk_note: Re-measure before/after; roll back if the metric regresses beyond the
      neutral threshold.
